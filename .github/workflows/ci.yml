name: CI

on:
  push:
  pull_request:

jobs:
  go:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Format
        shell: bash
        run: test -z "$(gofmt -l cmd internal)"
      - name: Test
        run: go test ./... -count=1
      - name: Fixed core delayed-create safety counterexample
        run: go -C tests/coreproof test -mod=readonly -count=1 ./...
      - name: Vet
        run: go vet ./...
      - name: Build
        run: go build ./cmd/platform-server ./cmd/node-controller ./cmd/content-tool
      - name: Linux deployment script syntax
        if: runner.os == 'Linux'
        shell: bash
        run: |
          bash -n deploy/systemd/start-d2core-manager.sh deploy/scripts/backup-postgres.sh deploy/scripts/switch-platform-release.sh
          python3 tools/deploy_check.py
      - name: Windows deployment script syntax
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          foreach ($file in Get-ChildItem deploy/windows -Filter *.ps1) {
            $tokens = $null; $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile($file.FullName, [ref]$tokens, [ref]$errors) | Out-Null
            if ($errors.Count) { throw "$($file.Name): $($errors[0].Message)" }
          }

  postgres-integration:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PLATFORM_TEST_DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/postgres?sslmode=disable
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go test ./internal/platform/store ./internal/platform/httpapi -count=1
        env:
          RC1_BACKUP_TEST: '1'

  web:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PGHOST: 127.0.0.1
      PGUSER: postgres
      PGPASSWORD: postgres
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Clean Web checks and all supported release packages
        working-directory: .
        run: python3 tools/release.py --output dist/rc1-ci
      - name: Linux artifact smoke and archive integrity
        working-directory: .
        run: |
          createdb rc1_artifact
          python3 tools/release_smoke.py dist/rc1-ci
        env:
          PLATFORM_SMOKE_DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/rc1_artifact?sslmode=disable
      - name: Dispose artifact smoke database
        if: always()
        run: dropdb --if-exists rc1_artifact
      - uses: actions/upload-artifact@v4
        with:
          name: rc1-${{ github.sha }}
          path: |
            dist/rc1-ci/*-amd64
            dist/rc1-ci/*.exe
            dist/rc1-ci/*.zip
            dist/rc1-ci/*.tar.gz
            dist/rc1-ci/MANIFEST.json
            dist/rc1-ci/SHA256SUMS

  windows-artifacts:
    needs: web
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: rc1-${{ github.sha }}
          path: dist/rc1-ci
      - run: python tools/release_smoke.py dist/rc1-ci
